<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#001E6A;text-decoration:none;text-underline-offset:3px}a:hover{color:#2A4BC4}
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1)}
html{scrollbar-color:#B9C2E2 transparent;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
::selection{background:#001E6A;color:#FFFFFF}
:focus-visible{outline:2px solid #2A4BC4;outline-offset:3px}
input,select,textarea,button{font:inherit}
.cx-num{font-variant-numeric:tabular-nums}
.cx-pair{display:inline-flex;align-items:center;gap:6px}
.cx-btn{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:0 24px 0 18px;border-radius:16px;background:#001E6A;color:#FFFFFF;font-family:'Hanken Grotesk',sans-serif;font-size:17px;white-space:nowrap;transition:background-color .2s ease,color .2s ease,transform .16s var(--ease-out)}
.cx-arrow{width:52px;height:52px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#001E6A;color:#FFFFFF;transition:background-color .2s ease,color .2s ease,transform .32s var(--ease-out)}
.cx-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;transition:transform .25s var(--ease-out),background-color .2s ease}
.cx-light .cx-btn,.cx-light .cx-arrow{background:#FFFFFF;color:#001E6A}
.cx-ghost .cx-btn,.cx-ghost .cx-arrow{background:transparent;color:#001E6A;box-shadow:inset 0 0 0 1px #B9C2E2}
.cx-pair:active .cx-btn{transform:scale(.97)}
.cx-pair:active .cx-arrow{transform:scale(.94)}
.cx-tab{white-space:nowrap;transition:background-color .2s ease,color .2s ease,box-shadow .2s ease,transform .16s var(--ease-out)}
.cx-tab:active,.cx-opt:active,.cx-launch:active{transform:scale(.97)}
.cx-opt,.cx-launch{transition:background-color .15s ease,border-color .15s ease,transform .16s var(--ease-out)}
.cx-zoom{overflow:hidden}
.cx-zoom img{transition:transform 1.2s var(--ease-out)}
.cx-track{--cx-cw:86%;--cx-gap:24px;gap:var(--cx-gap);transition:transform .7s var(--ease-io)}
.cx-slide{transition:opacity .6s ease}
.cx-sph{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFFFFF 0%,#F4F5FB 28%,#D9DDF1 68%,#BFC6E6 100%);box-shadow:inset -12px -16px 34px rgba(110,122,190,.28),0 24px 50px rgba(40,52,130,.10);animation:cx-float 9s ease-in-out infinite}
.cx-ring{position:absolute;border-radius:50%;border:1px solid rgba(0,30,106,.16);animation:cx-spin 36s linear infinite}
.cx-orb{position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%}
.cx-p{position:absolute;border-radius:50%;background:#C9D5FF;animation:cx-tw 4s ease-in-out infinite}
.cx-marq{display:flex;width:max-content;animation:cx-marq 38s linear infinite}
.cx-fade{animation:cx-in .8s var(--ease-out) both}
.cx-rise{animation:cx-up 1s var(--ease-out) both}
.cx-d1{animation-delay:.12s}.cx-d2{animation-delay:.24s}.cx-d3{animation-delay:.36s}
.cx-pop{animation:cx-pop .22s var(--ease-out) both}
.cx-seg{scrollbar-width:none}
.cx-seg::-webkit-scrollbar{display:none}
.cx-kb{animation:cx-kb 26s ease-in-out infinite alternate;transform-origin:70% 40%}
.cx-scanline{position:absolute;left:0;right:0;top:-30%;height:30%;background:linear-gradient(180deg,transparent,rgba(201,213,255,.16) 60%,rgba(255,255,255,.28) 62%,transparent 64%);animation:cx-scan 7s cubic-bezier(.45,0,.55,1) infinite;pointer-events:none}
.cx-lot svg{display:block}
@keyframes cx-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes cx-spin{to{transform:rotate(360deg)}}
@keyframes cx-tw{0%,100%{opacity:.15}50%{opacity:.95}}
@keyframes cx-marq{to{transform:translateX(-50%)}}
@keyframes cx-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes cx-up{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes cx-pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes cx-kb{from{transform:scale(1.14)}to{transform:scale(1.26) translate(-2%,-1.5%)}}
@keyframes cx-scan{from{transform:translateY(0)}to{transform:translateY(440%)}}
@keyframes cx-op{from{opacity:0}to{opacity:1}}
@keyframes cx-par{from{translate:0 -7%}to{translate:0 7%}}
@keyframes cx-par-lg{from{translate:0 -6%}to{translate:0 6%}}
@keyframes cx-par-hero{from{translate:0 0}to{translate:0 160px}}
/* Signature : la carte qui s'assemble */
.cx-sig{view-timeline-name:--pcb;view-timeline-axis:block}
@keyframes cx-draw-s{to{stroke-dashoffset:0}}
@keyframes cx-on{to{opacity:1}}
@keyframes cx-pop-s{to{opacity:1;scale:1}}
@keyframes cx-drop{to{opacity:1;translate:0 0}}
@keyframes cx-step{0%{opacity:.3}12%,88%{opacity:1}100%{opacity:.3}}
@keyframes cx-grow-y{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes cx-sheen{from{translate:-110% 0}to{translate:110% 0}}
@keyframes cx-glow{0%,100%{opacity:.55}50%{opacity:1}}
@supports (animation-timeline: view()){
@media (prefers-reduced-motion: no-preference){
.cx-rv{animation:cx-up linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
.cx-zoom img{scale:1.16;animation:cx-par linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
.cx-cine .cx-kb{animation:cx-kb 26s ease-in-out infinite alternate,cx-par-lg linear both;animation-timeline:auto,view();animation-range:normal,cover 0% cover 100%}
.cx-orbit-art{animation:cx-par-hero linear both;animation-timeline:scroll(root);animation-range:0px 900px}
.cx-l1 .cx-trace{stroke-dasharray:1;stroke-dashoffset:1;animation:cx-draw-s linear both;animation-timeline:--pcb;animation-range:contain 2% contain 22%}
.cx-l1 .cx-pad{opacity:0;animation:cx-on linear both;animation-timeline:--pcb;animation-range:contain 14% contain 24%}
.cx-l2 circle{opacity:0;scale:.2;transform-box:fill-box;transform-origin:center;animation:cx-pop-s linear both;animation-timeline:--pcb;animation-range:contain 27% contain 46%}
.cx-l3>g{opacity:0;translate:0 -46px;animation:cx-drop linear both;animation-timeline:--pcb;animation-range:contain 50% contain 70%}
.cx-l3>g:nth-child(2n){animation-range:contain 53% contain 72%}
.cx-l3>g:nth-child(3n){animation-range:contain 56% contain 74%}
.cx-l4{opacity:0;animation:cx-on linear both;animation-timeline:--pcb;animation-range:contain 76% contain 92%}
.cx-sheen{animation:cx-sheen linear both;animation-timeline:--pcb;animation-range:contain 76% contain 100%}
.cx-step{animation:cx-step linear both;animation-timeline:--pcb}
.cx-step:nth-child(1){animation-range:contain 0% contain 25%}
.cx-step:nth-child(2){animation-range:contain 25% contain 50%}
.cx-step:nth-child(3){animation-range:contain 50% contain 75%}
.cx-step:nth-child(4){animation-range:contain 75% contain 100%}
.cx-prog{transform-origin:top;animation:cx-grow-y linear both;animation-timeline:--pcb;animation-range:contain 0% contain 100%}
.cx-led{animation:cx-glow 1.6s ease-in-out infinite}
}
}
@media (hover:hover) and (pointer:fine){
.cx-pair:hover .cx-btn,.cx-pair:hover .cx-arrow{background:#0B33A8;color:#FFFFFF}
.cx-pair:hover .cx-dot{transform:scale(1.3);background:currentColor}
.cx-pair:hover .cx-arrow{transform:rotate(45deg)}
.cx-pair:hover:active .cx-arrow{transform:rotate(45deg) scale(.94)}
.cx-light:hover .cx-btn,.cx-light:hover .cx-arrow{background:#E3E8FF;color:#001E6A}
.cx-ghost:hover .cx-btn,.cx-ghost:hover .cx-arrow{background:#001E6A;color:#FFFFFF}
.cx-tab[aria-selected="false"]:hover{background:#F2F4FB !important}
.cx-opt:hover{background:#ECEEF8 !important;border-color:#001E6A !important}
.cx-zoom:hover img{transform:scale(1.04)}
.cx-marq:hover{animation-play-state:paused}
.cx-step-link:hover{text-decoration:underline}
}
@media (max-width:1024px){.cx-orbit-art{opacity:.6}}
@media (max-width:900px){
.cx-sig-grid{grid-template-columns:1fr !important;grid-template-rows:auto 1fr;align-content:start !important;gap:16px !important;padding-top:24px !important}
.cx-sig-board{order:-1;max-height:46vh}
.cx-steps{gap:6px !important}
.cx-step{padding:12px 14px !important}
.cx-step-text{display:none}
.cx-sig{height:2600px !important}
.cx-trio{grid-template-columns:1fr 1fr !important}
.cx-trio>*:first-child{grid-column:1 / -1}
.cx-chip-lot{display:none !important}
.cx-cine-circuit{width:100% !important;right:-30% !important;opacity:.55 !important}
}
@media (max-width:760px){
.cx-container{padding-left:20px !important;padding-right:20px !important}
.cx-hero-inner{padding-top:36px !important;padding-bottom:72px !important;gap:28px !important}
.cx-orbit-art{transform:scale(.46);transform-origin:top right;right:-16px !important;top:0 !important;opacity:.45}
.cx-stats{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
.cx-stats>div{padding:20px 12px 20px 0 !important;border-right:0 !important;border-top:1px solid #DDE2F1}
.cx-stats .cx-num{font-size:44px !important}
.cx-seg{flex-wrap:nowrap !important;justify-content:flex-start !important;overflow-x:auto;width:100%;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.cx-seg>*{flex-shrink:0}
.cx-track{--cx-cw:90%;--cx-gap:12px}
.cx-card-body{padding:26px 22px 28px !important;gap:16px !important}
.cx-card-media{order:-1;min-height:220px !important;margin:10px 10px 0 !important;flex-basis:100% !important}
.cx-card-media img{min-height:220px !important}
.cx-pad{padding:32px 22px !important}
.cx-sec{padding-top:72px !important;padding-bottom:72px !important}
.cx-cine{border-radius:28px !important}
.cx-cine-body{padding:32px 22px !important}
.cx-trio{grid-template-columns:1fr !important;grid-auto-rows:240px !important}
.cx-promises{grid-template-columns:1fr !important}
}
@media (prefers-reduced-motion: reduce){
.cx-sph,.cx-ring,.cx-marq,.cx-p,.cx-kb,.cx-scanline{animation:none !important}
.cx-rise,.cx-fade,.cx-pop{animation:cx-op .25s ease both !important}
.cx-track,.cx-zoom img{transition:none !important}
}
</style>

<body>
<div id="root"></div>
<script>DC.mount({"Main":{"html":"\n\n<div style=\"font-family: Roboto, system-ui, sans-serif; color: #001E6A; background: #FFFFFF; width: 100%; overflow-x: clip; position: relative\">\n\n  <\!-- ===== 1. PROMESSE ===== -->\n  <section style=\"position: relative; background: #ECEEF8; border-radius: 0 0 48px 48px; overflow: hidden\">\n    <div aria-hidden=\"true\" style=\"position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(0,30,106,0.10) 1px, transparent 1.6px); background-size: 26px 26px; opacity: 0.7\"></div>\n    <div aria-hidden=\"true\" class=\"cx-orbit-art\" style=\"position: absolute; right: -60px; top: 40px; width: 760px; height: 760px\">\n      <div class=\"cx-ring\" style=\"left: 60px; top: 60px; width: 640px; height: 640px\"><span class=\"cx-orb\" style=\"background: #3BD16F; box-shadow: 0 0 0 6px rgba(59,209,111,0.18)\"></span></div>\n      <div class=\"cx-ring\" style=\"left: 150px; top: 150px; width: 460px; height: 460px; animation-duration: 24s; animation-direction: reverse\"><span class=\"cx-orb\" style=\"background: #FF8A3D; box-shadow: 0 0 0 6px rgba(255,138,61,0.18)\"></span></div>\n      <div class=\"cx-ring\" style=\"left: 235px; top: 235px; width: 290px; height: 290px; animation-duration: 16s\"><span class=\"cx-orb\" style=\"background: #FF4D5E; box-shadow: 0 0 0 6px rgba(255,77,94,0.18)\"></span></div>\n      <span class=\"cx-sph\" style=\"left: 300px; top: 300px; width: 160px; height: 160px\"></span>\n      <span class=\"cx-sph\" style=\"left: 210px; top: 250px; width: 110px; height: 110px; animation-delay: -2s\"></span>\n      <span class=\"cx-sph\" style=\"left: 440px; top: 230px; width: 96px; height: 96px; animation-delay: -4s\"></span>\n      <span class=\"cx-sph\" style=\"left: 420px; top: 420px; width: 120px; height: 120px; animation-delay: -6s\"></span>\n      <span class=\"cx-sph\" style=\"left: 250px; top: 420px; width: 84px; height: 84px; animation-delay: -3s\"></span>\n      <span class=\"cx-sph\" style=\"left: 560px; top: 130px; width: 64px; height: 64px; animation-delay: -1s\"></span>\n      <span class=\"cx-sph\" style=\"left: 610px; top: 520px; width: 70px; height: 70px; animation-delay: -7s\"></span>\n    </div>\n    <div style=\"position: relative\"><dc-import name=\"Header\" active=\"accueil\" hint-size=\"100%,84px\"></dc-import></div>\n\n    <div class=\"cx-container cx-hero-inner\" style=\"position: relative; max-width: 1240px; margin: 0 auto; padding: 96px 32px 128px; display: flex; flex-wrap: wrap; gap: 48px 64px; align-items: flex-end\">\n      <h1 class=\"cx-rise\" style=\"flex: 1 1 560px; margin: 0; font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: clamp(44px, 5.6vw, 80px); line-height: 1.04; letter-spacing: -0.025em\">Tout pour fabriquer<br>vos cartes électroniques.</h1>\n      <div class=\"cx-rise cx-d2\" style=\"flex: 1 1 380px; max-width: 480px; display: flex; flex-direction: column; gap: 26px; padding-bottom: 8px\">\n        <p style=\"margin: 0; font-size: 17px; line-height: 1.7; color: #1D2F72\">Consommables, outillage et équipements de soudage pour l’industrie électronique. Un interlocuteur technique, un stock à Grenoble, du prototype à la grande série.</p>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n          <a href=\"contact.html\" class=\"cx-pair\"><span class=\"cx-btn\"><span class=\"cx-dot\"></span>Demander un devis</span><span class=\"cx-arrow\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17L17 7M9 7h8v8\"></path></svg></span></a>\n          <a href=\"produits.html\" class=\"cx-pair cx-ghost\"><span class=\"cx-btn\"><span class=\"cx-dot\"></span>Voir les produits</span></a>\n        </div>\n        <ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: #1D2F72\">\n          <li style=\"display: flex; gap: 10px; align-items: center\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2A4BC4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0\"><path d=\"M20 6L9 17l-5-5\"></path></svg>Distributeur officiel JBC &amp; ZEVATRON</li>\n          <li style=\"display: flex; gap: 10px; align-items: center\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2A4BC4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0\"><path d=\"M20 6L9 17l-5-5\"></path></svg>Livraison sous 48 h des produits en stock</li>\n          <li style=\"display: flex; gap: 10px; align-items: center\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2A4BC4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0\"><path d=\"M20 6L9 17l-5-5\"></path></svg>Conseil technique, depuis 1958</li>\n        </ul>\n      </div>\n    </div>\n  </section>\n\n  <\!-- ===== 2. PREUVES ===== -->\n  <section class=\"cx-container\" style=\"max-width: 1240px; margin: 0 auto; padding: 80px 32px 24px\">\n    <div class=\"cx-rv cx-stats\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0\">\n      <div style=\"padding: 8px 28px 8px 0; border-right: 1px solid #DDE2F1; display: flex; flex-direction: column; gap: 6px\">\n        <span class=\"cx-num\" style=\"font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: 64px; letter-spacing: -0.03em; line-height: 1\">{{n1}}</span>\n        <span style=\"color: #4B5A8C\">Année de création, à Fontaine (38)</span>\n      </div>\n      <div style=\"padding: 8px 28px; border-right: 1px solid #DDE2F1; display: flex; flex-direction: column; gap: 6px\">\n        <span class=\"cx-num\" style=\"font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: 64px; letter-spacing: -0.03em; line-height: 1\">{{n2}}+ ans</span>\n        <span style=\"color: #4B5A8C\">Au service de l’industrie électronique</span>\n      </div>\n      <div style=\"padding: 8px 28px; border-right: 1px solid #DDE2F1; display: flex; flex-direction: column; gap: 6px\">\n        <span class=\"cx-num\" style=\"font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: 64px; letter-spacing: -0.03em; line-height: 1\">{{n3}} h</span>\n        <span style=\"color: #4B5A8C\">Livraison des produits en stock</span>\n      </div>\n      <div style=\"padding: 8px 0 8px 28px; display: flex; flex-direction: column; gap: 6px\">\n        <span class=\"cx-num\" style=\"font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: 64px; letter-spacing: -0.03em; line-height: 1\">{{n4}}</span>\n        <span style=\"color: #4B5A8C\">Univers produits, un seul interlocuteur</span>\n      </div>\n    </div>\n  </section>\n  <section aria-label=\"Marques distribuées\" style=\"margin-top: 48px; border-top: 1px solid #DDE2F1; border-bottom: 1px solid #DDE2F1; padding: 30px 0; overflow: hidden\">\n    <div class=\"cx-marq\">\n      <sc-for list=\"{{brandsLoop}}\" as=\"b\" hint-placeholder-count=\"10\">\n        <span style=\"padding: 0 40px; font-family: 'Hanken Grotesk', sans-serif; font-size: 24px; letter-spacing: 0.06em; color: #4B5A8C; white-space: nowrap; display: inline-flex; align-items: center; gap: 40px\">{{b}}<span aria-hidden=\"true\" style=\"width: 6px; height: 6px; border-radius: 50%; background: #B9C2E2\"></span></span>\n      </sc-for>\n    </div>\n  </section>\n\n  <\!-- ===== 3. SIGNATURE : LA CARTE QUI S'ASSEMBLE ===== -->\n  <section class=\"cx-sig\" aria-label=\"De la carte nue à la carte finie\" style=\"position: relative; height: 3200px; margin-top: 64px\">\n    <div style=\"position: sticky; top: 0; height: min(100vh, 880px); overflow: hidden\">\n      <div class=\"cx-container cx-sig-grid\" style=\"max-width: 1240px; height: 100%; margin: 0 auto; padding: 48px 32px; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.2fr); gap: 56px; align-items: center\">\n        <div style=\"display: flex; flex-direction: column; gap: 28px\">\n          <h2 style=\"margin: 0; font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: clamp(32px, 3.8vw, 54px); line-height: 1.06; letter-spacing: -0.02em\">De la carte nue à la carte finie, tout passe par nos rayons.</h2>\n          <div style=\"position: relative; padding-left: 22px\">\n            <div aria-hidden=\"true\" style=\"position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; background: #DDE2F1; border-radius: 2px\"></div>\n            <div aria-hidden=\"true\" class=\"cx-prog\" style=\"position: absolute; left: 0; top: 4px; bottom: 4px; width: 2px; background: #001E6A; border-radius: 2px\"></div>\n            <ol class=\"cx-steps\" style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px\">\n              <li class=\"cx-step\" style=\"padding: 14px 16px; border-radius: 18px; display: flex; flex-direction: column; gap: 6px\">\n                <span style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 22px\"><span style=\"color: #2A4BC4; margin-right: 10px\">01</span>Le circuit</span>\n                <span class=\"cx-step-text\" style=\"color: #1D2F72; line-height: 1.6\">Connectique, câblage et matériel de test pour valider chaque piste.</span>\n                <a class=\"cx-step-link\" href=\"produits.html#connectique\" style=\"font-size: 14px; color: #2A4BC4\">Connectique &amp; test →</a>\n              </li>\n              <li class=\"cx-step\" style=\"padding: 14px 16px; border-radius: 18px; display: flex; flex-direction: column; gap: 6px\">\n                <span style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 22px\"><span style=\"color: #2A4BC4; margin-right: 10px\">02</span>Le brasage</span>\n                <sp var a = window.lottie.loadAnimation({ container: el, renderer: 'svg', loop: opts.loop !== false, autoplay: !reduce, path: path, rendererSettings: { preserveAspectRatio: opts.par || 'xMidYMid meet' } });\n      if (reduce) a.addEventListener('DOMLoaded', function () { a.goToAndStop(a.totalFrames - 1, true); });\n      self.anims.push(a);\n    };\n    go();\n  }\n  componentDidMount() {\n    var self = this;\n    var start = null;\n    var step = function (ts) {\n      if (start === null) start = ts;\n      var p = Math.min(1, (ts - start) / 1800);\n      self.setState({ c: p });\n      if (p < 1) self.raf = requestAnimationFrame(step);\n    };\n    this.raf = requestAnimationFrame(step);\n  }\n  componentWillUnmount() {\n    if (this.raf) cancelAnimationFrame(this.raf);\n    (this.anims || []).forEach(function (a) { try { a.destroy(); } catch (e) {} });\n  }\n  renderVals() {\n    var self = this;\n    var st = this.state;\n    var e = 1 - Math.pow(1 - st.c, 3);\n    var tabsData = [\n      { label: 'Soudure & brasage', href: 'produits.html#soudure', img: 'assets/iron.jpg', alt: 'Fer à souder et sa panne', title: 'Soudure & brasage : la fiabilité de chaque joint', text: 'Fils, barres, crèmes à braser et flux des grandes marques, stations de soudage JBC et équipements ZEVATRON : tout pour le brasage manuel comme pour la production.', tags: ['Fils & barres', 'Flux', 'Stations JBC', 'ZEVATRON'] },\n      { label: 'Connectique & test', href: 'produits.html#connectique', img: 'assets/tester.jpg', alt: 'Cartes électroniques et appareil de mesure', title: 'Connectique & test : valider chaque assemblage', text: 'Connecteurs, accessoires de câblage et matériel de test pour contrôler vos cartes, du prototype à la série.', tags: ['Connecteurs', 'Câblage', 'Test'] },\n      { label: 'Vernis, résines & nettoyage', href: 'produits.html#chimie', img: 'assets/pcbteal.jpg', alt: 'Carte électronique en gros plan', title: 'Chimie : protéger et nettoyer vos cartes', text: 'Vernis de pro
