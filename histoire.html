<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#001E6A;text-decoration:none}a:hover{color:#2A4BC4}
.cx-pair{display:inline-flex;align-items:center;gap:6px}
.cx-btn{display:inline-flex;align-items:center;gap:12px;min-height:50px;padding:0 24px 0 18px;border-radius:16px;background:#001E6A;color:#FFFFFF;font-family:'Hanken Grotesk',sans-serif;font-size:17px;transition:background .35s ease}
.cx-arrow{width:50px;height:50px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#001E6A;color:#FFFFFF;transition:transform .45s cubic-bezier(.2,.8,.2,1),background .35s}
.cx-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;transition:transform .4s ease,background .4s ease}
.cx-light .cx-btn,.cx-light .cx-arrow{background:#FFFFFF;color:#001E6A}
.cx-zoom{overflow:hidden}
.cx-zoom img{transition:transform 1.2s cubic-bezier(.23,1,.32,1)}
.cx-ms{transition:background-color .25s ease}
.cx-sph{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFFFFF 0%,#F4F5FB 28%,#D9DDF1 68%,#BFC6E6 100%);box-shadow:inset -12px -16px 34px rgba(110,122,190,.28),0 24px 50px rgba(40,52,130,.10);animation:cx-float 9s ease-in-out infinite}
.cx-p{position:absolute;border-radius:50%;background:#C9D5FF;animation:cx-tw 4s ease-in-out infinite}
.cx-field{position:absolute;inset:-5%;animation:cx-drift 26s ease-in-out infinite alternate}
.cx-fade{animation:cx-in .8s cubic-bezier(.2,.8,.2,1) both}
.cx-rise{animation:cx-up 1s cubic-bezier(.2,.8,.2,1) both}
.cx-d2{animation-delay:.24s}
.cx-line{transform-origin:top;animation:cx-grow linear both;animation-timeline:view();animation-range:entry 10% exit 60%}
@keyframes cx-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes cx-tw{0%,100%{opacity:.15}50%{opacity:.95}}
@keyframes cx-drift{from{transform:translate(0,0)}to{transform:translate(-3%,2%)}}
@keyframes cx-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes cx-up{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes cx-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@supports (animation-timeline: view()){.cx-rv{animation:cx-up linear both;animation-timeline:view();animation-range:entry 0% entry 40%}}
@supports not (animation-timeline: view()){.cx-line{animation:none}}
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1)}
html{scrollbar-color:#B9C2E2 transparent;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
::selection{background:#001E6A;color:#FFFFFF}
:focus-visible{outline:2px solid #2A4BC4;outline-offset:3px}
a{text-underline-offset:3px}
.cx-btn{white-space:nowrap;transition:background-color .2s ease,color .2s ease,transform .16s var(--ease-out)}
.cx-arrow{transition:background-color .2s ease,color .2s ease,transform .32s var(--ease-out)}
.cx-dot{transition:transform .25s var(--ease-out),background-color .2s ease}
.cx-pair:active .cx-btn{transform:scale(.97)}
.cx-pair:active .cx-arrow{transform:scale(.94)}
.cx-opt:active,.cx-launch:active{transform:scale(.97)}
.cx-opt,.cx-launch{transition:background-color .15s ease,border-color .15s ease,transform .16s var(--ease-out)}
.cx-pop{animation:cx-pop .22s var(--ease-out) both}
@keyframes cx-pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@media (hover:hover) and (pointer:fine){
.cx-pair:hover .cx-btn,.cx-pair:hover .cx-arrow{background:#0B33A8;color:#FFFFFF}
.cx-pair:hover .cx-dot{transform:scale(1.3);background:currentColor}
.cx-pair:hover .cx-arrow{transform:rotate(45deg)}
.cx-pair:hover:active .cx-arrow{transform:rotate(45deg) scale(.94)}
.cx-light:hover .cx-btn,.cx-light:hover .cx-arrow{background:#E3E8FF;color:#001E6A}
.cx-opt:hover{background:#ECEEF8 !important;border-color:#001E6A !important}
.cx-zoom:hover img{transform:scale(1.04)}
.cx-ms:hover{background:#F6F7FC}
}
@media (max-width:760px){
.cx-container{padding-left:20px !important;padding-right:20px !important}
.cx-hero-inner{padding-top:36px !important;padding-bottom:88px !important}
.cx-sec{padding-top:72px !important;padding-bottom:40px !important}
.cx-sec-f{padding-top:72px !important;padding-bottom:120px !important}
.cx-ms{padding:20px 8px 20px 56px !important}
.cx-ms-dot{left:12px !important}
.cx-ms-rail{left:21px !important}
.cx-ms-year{flex-basis:100% !important;font-size:36px !important}
.cx-pad{padding:32px 24px !important}
.cx-media{min-height:280px !important}
}
@media (prefers-reduced-motion: reduce){
.cx-sph,.cx-field,.cx-p,.cx-line{animation:none !important}
.cx-rise,.cx-fade,.cx-rv,.cx-pop{animation:cx-op .25s ease both !important;animation-timeline:auto !important}
.cx-zoom img{transition:none !important}
}
@keyframes cx-op{from{opacity:0}to{opacity:1}}
@keyframes cx-par{from{translate:0 -7%}to{translate:0 7%}}
@keyframes cx-par-x{from{translate:0 0}to{translate:-12% 0}}
@supports (animation-timeline: view()){
@media (prefers-reduced-motion: no-preference){
.cx-zoom img{scale:1.16;animation:cx-par linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
.cx-par-x{animation:cx-par-x linear both;animation-timeline:scroll(root);animation-range:0px 800px}
}
}
</style>

<script>DC.mount({"Histoire":{"html":"\n\n<div style=\"font-family: Roboto, system-ui, sans-serif; color: #001E6A; background: #FFFFFF; width: 100%; overflow-x: clip; position: relative\">\n\n  <\!-- Hero -->\n  <section style=\"position: relative; background: #ECEEF8; border-radius: 0 0 48px 48px; overflow: hidden\">\n    <div aria-hidden=\"true\" style=\"position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(0,30,106,0.10) 1px, transparent 1.6px); background-size: 26px 26px; opacity: 0.7\"></div>\n    <div aria-hidden=\"true\" class=\"cx-par-x\" style=\"position: absolute; right: -20px; bottom: -40px; font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: clamp(140px, 24vw, 360px); line-height: 1; letter-spacing: -0.05em; color: transparent; -webkit-text-stroke: 1.5px rgba(0,30,106,0.18)\">1958</div>\n    <span aria-hidden=\"true\" class=\"cx-sph\" style=\"right: 22%; top: 140px; width: 90px; height: 90px\"></span>\n    <span aria-hidden=\"true\" class=\"cx-sph\" style=\"right: 12%; top: 230px; width: 60px; height: 60px; animation-delay: -4s\"></span>\n    <div style=\"position: relative\"><dc-import name=\"Header\" active=\"histoire\" hint-size=\"100%,84px\"></dc-import></div>\n    <div class=\"cx-container cx-hero-inner\" style=\"position: relative; max-width: 1240px; margin: 0 auto; padding: 72px 32px 140px; display: flex; flex-direction: column; gap: 24px\">\n      <nav aria-label=\"Fil d’Ariane\" style=\"font-size: 14px; color: #4B5A8C\"><a href=\"index.html\" style=\"color: #4B5A8C\">Accueil</a> <span aria-hidden=\"true\">/</span> Notre histoire</nav>\n      <h1 class=\"cx-rise\" style=\"margin: 0; font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: clamp(44px, 5.4vw, 76px); line-height: 1.04; letter-spacing: -0.025em; max-width: 820px\">Plus de 60 ans au cœur de l’électronique alpine</h1>\n      <p class=\"cx-rise cx-d2\" style=\"margin: 0; max-width: 600px; font-size: 17px; line-height: 1.7; color: #1D2F72\">D’un commerce de téléviseurs à Fontaine à un distributeur de référence pour l’industrie de la carte électronique : une histoire grenobloise, bâtie sur la fidélité de nos clients.</p>\n    </div>\n  </section>\n\n  <\!-- Intro -->\n  <section class=\"cx-container cx-sec\" style=\"max-width: 1240px; margin: 0 auto; padding: 120px 32px 40px\">\n    <div class=\"cx-rv\" style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n      <div style=\"flex: 1 1 420px; display: flex; flex-direction: column; gap: 22px; justify-content: center; padding-right: 24px\">\n        <h2 style=\"margin: 0; font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: clamp(32px, 3.4vw, 48px); line-height: 1.1; letter-spacing: -0.02em\">Accueil, écoute et service</h2>\n        <p style=\"margin: 0; line-height: 1.75; color: #1D2F72\">Nous adaptons nos offres aux évolutions du secteur et servons aussi bien les prototypes que les petites séries et les grands volumes. C’est cette exigence qui nous a fait devenir une référence dans notre domaine.</p>\n        <p style=\"margin: 0; line-height: 1.75; color: #1D2F72\">L’entreprise est aujourd’hui dirigée par Magaly Berthet et Thierry Le Clech.</p>\n      </div>\n      <div style=\"flex: 1 1 420px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; min-height: 440px\">\n        <div class=\"cx-zoom cx-media\" style=\"grid-row: span 2; border-radius: 30px; position: relative; min-height: 220px\">\n          <img src=\"assets/p-ingenieure.jpg\" alt=\"Ingénieure contrôlant un équipement électronique\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\">\n        </div>\n        <div class=\"cx-zoom\" style=\"border-radius: 24px; position: relative; min-height: 140px\">\n          <img src=\"assets/pcb.jpg\" alt=\"Circuit imprimé à finition or, en gros plan\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\">\n        </div>\n        <div class=\"cx-zoom\" style=\"border-radius: 24px; position: relative; min-height: 140px\">\n          <img src=\"assets/p-multimetre.jpg\" alt=\"Mesure au multimètre sur une carte\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\">\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <\!-- Frise -->\n  <section class=\"cx-container cx-sec\" style=\"max-width: 1240px; margin: 0 auto; padding: 80px 32px 120px\">\n    <h2 class=\"cx-rv\" style=\"margin: 0 0 56px; text-align: center; font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: clamp(36px, 4vw, 58px); letter-spacing: -0.02em\">Les grandes étapes</h2>\n    <div style=\"position: relative; max-width: 960px; margin: 0 auto\">\n      <div aria-hidden=\"true\" class=\"cx-ms-rail\" style=\"position: absolute; left: 31px; top: 0; bottom: 0; width: 1px; background: #DDE2F1\"></div>\n      <div aria-hidden=\"true\" class=\"cx-line cx-ms-rail\" style=\"position: absolute; left: 31px; top: 0; bottom: 0; width: 2px; background: #001E6A\"></div>\n      <ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px\">\n        <sc-for list=\"{{milestones}}\" as=\"m\" hint-placeholder-count=\"7\">\n          <li class=\"cx-rv cx-ms\" style=\"position: relative; display: flex; flex-wrap: wrap; gap: 8px 40px; padding: 28px 28px 28px 88px; border-radius: 24px\">\n            <span aria-hidden=\"true\" class=\"cx-ms-dot\" style=\"position: absolute; left: 22px; top: 36px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; border: 2px solid #001E6A; display: flex; align-items: center; justify-content: center\"><span style=\"width: 8px; height: 8px; border-radius: 50%; background: {{m.color}}\"></span></span>\n            <span class=\"cx-ms-year\" style=\"flex: 0 0 200px; font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: 44px; letter-spacing: -0.02em; line-height: 1\">{{m.year}}</span>\n            <div style=\"flex: 1 1 340px; display: flex; flex-direction: column; gap: 8px\">\n              <span style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 22px\">{{m.title}}</span>\n              <span style=\"line-height: 1.7; color: #1D2F72\">{{m.text}}</span>\n            </div>\n          </li>\n        </sc-for>\n      </ol>\n    </div>\n  </section>\n\n  <\!-- Valeurs -->\n  <section class=\"cx-container\" style=\"max-width: 1240px; margin: 0 auto; padding: 0 32px 128px\">\n    <div class=\"cx-rv\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px\">\n      <div style=\"border: 1px solid #C9D0EA; border-radius: 26px; padding: 36px 32px; display: flex; flex-direction: column; gap: 14px; background-image: radial-gradient(circle, rgba(0,30,106,0.10) 1px, transparent 1.6px); background-size: 22px 22px\">\n        <span style=\"font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: 44px\">01</span>\n        <span style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 24px\">Accueil</span>\n        <span style=\"line-height: 1.7; color: #1D2F72\">Un interlocuteur disponible pour chaque demande, quel que soit le volume.</span>\n      </div>\n      <div style=\"border: 1px solid #C9D0EA; border-radius: 26px; padding: 36px 32px; display: flex; flex-direction: column; gap: 14px; background-image: radial-gradient(circle, rgba(0,30,106,0.10) 1px, transparent 1.6px); background-size: 22px 22px\">\n        <span style=\"font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: 44px\">02</span>\n        <span style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 24px\">Écoute</span>\n        <span style=\"line-height: 1.7; color: #1D2F72\">Comprendre votre process pour proposer le produit adapté, pas seulement le produit demandé.</span>\n      </div>\n      <div style=\"border: 1px solid #C9D0EA; border-radius: 26px; padding: 36px 32px; display: flex; flex-direction: column; gap: 14px; background-image: radial-gradient(circle, rgba(0,30,106,0.10) 1px, transparent 1.6px); background-size: 22px 22px\">\n        <span style=\"font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: 44px\">03</span>\n        <span style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 24px\">Service</span>\n        <span style=\"line-height: 1.7; color: #1D2F72\">Stock à Grenoble, livraison sous 48 h et suivi, du prototype à la grande série.</span>\n      </div>\n    </div>\n  </section>\n\n  <\!-- Locaux -->\n  <section style=\"position: relative; background: #001E6A; color: #FFFFFF; overflow: hidden\">\n    <div aria-hidden=\"true\" class=\"cx-field\">\n      <sc-for list=\"{{particles}}\" as=\"p\" hint-placeholder-count=\"0\">\n        <span class=\"cx-p\" style=\"{{p.s}}\"></span>\n      </sc-for>\n    </div>\n    <div class=\"cx-container cx-sec-f\" style=\"position: relative; max-width: 1240px; margin: 0 auto; padding: 120px 32px 200px; display: flex; flex-wrap: wrap; gap: 40px 64px; align-items: center\">\n      <div style=\"flex: 1 1 460px; display: flex; flex-direction: column; gap: 22px\">\n        <span style=\"font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #C9D3F5\">Depuis 2015</span>\n        <h2 class=\"cx-rv\" style=\"margin: 0; font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: clamp(34px, 4vw, 56px); line-height: 1.08; letter-spacing: -0.02em\">Espace Général Mangin, Grenoble</h2>\n        <p class=\"cx-rv\" style=\"margin: 0; line-height: 1.7; color: #D5DCF5; font-size: 17px\">Un bâtiment pensé pour stocker davantage de références et vous livrer plus vite. Passez nous voir au 73D, rue du Général Mangin.</p>\n        <div><a href=\"contact.html\" class=\"cx-pair cx-light\"><span class=\"cx-btn\"><span class=\"cx-dot\"></span>Nous rendre visite</span><span class=\"cx-arrow\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17L17 7M9 7h8v8\"></path></svg></span></a></div>\n      </div>\n      <div class=\"cx-zoom\" style=\"flex: 1 1 380px; min-height: 380px; border-radius: 30px; position: relative\">\n        <img src=\"assets/gre-monts.jpg\" alt=\"Grenoble et ses montagnes, avec le téléphérique de la Bastille\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\">\n      </div>\n    </div>\n  </section>\n\n  <div style=\"margin-top: -48px; position: relative\"><dc-import name=\"Footer\" hint-size=\"100%,620px\"></dc-import></div>\n  <dc-import name=\"Agent\" hint-size=\"0px,0px\"></dc-import>\n</div>\n","js":"\nclass Component extends DCLogic {\n  cxParticles(seed, n) {\n    var s = seed;\n    function r() { s = (s * 9301 + 49297) % 233280; return s / 233280; }\n    var out = [];\n    for (var i = 0; i < n; i++) {\n      var t = r();\n      var spread = (r() - 0.5) * (18 + t * 26);\n      var x = 28 + t * 72 + spread * 0.6;\n      var y = 108 - t * 112 + spread;\n      var size = 1 + r() * 3.2;\n      out.push({ s: 'left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%;width:' + size.toFixed(1) + 'px;height:' + size.toFixed(1) + 'px;animation-duration:' + (2.5 + r() * 4).toFixed(2) + 's;animation-delay:-' + (r() * 6).toFixed(2) + 's' });\n    }\n    return out;\n  }\n  renderVals() {\n    var colors = ['#3BD16F', '#FF8A3D', '#FF4D5E', '#2A4BC4'];\n    var ms = [\n      { year: '1958', title: 'La fondation', text: 'Mme Charvet crée l’entreprise à Fontaine, près de Grenoble, d’abord pour distribuer des téléviseurs.' },\n      { year: '1970–2000', title: 'La référence régionale', text: 'Charvet s’impose en Rhône-Alpes comme distributeur de composants électroniques et de consommables pour la fabrication de cartes, et développe la vente des connecteurs COMATEL.' },\n      { year: '1999', title: 'Une nouvelle étape', text: 'CDS Électronique reprend la société auprès de Michel et Simon Charvet.' },\n      { year: '2004', title: 'Au service des câbleurs', text: 'Christian Baillargeon rachète l’entreprise et élargit le service aux sociétés de câblage de la région.' },\n      { year: '2012', title: 'Une direction renouvelée', text: 'Magaly Berthet et Thierry Le Clech reprennent l’entreprise.' },\n      { year: '2015', title: 'De nouveaux locaux', text: 'Installation à Grenoble, Espace Général Mangin, avec une capacité de stockage accrue.' },\n      { year: '2017', title: 'ZEVATRON', text: 'Reprise de la commercialisation de la gamme d’équipements de soudage ZEVATRON.' }\n    ];\n    return {\n      milestones: ms.map(function (m, i) { return Object.assign({ color: colors[i % colors.length] }, m); }),\n      particles: this.cxParticles(17, 120)\n    };\n  }\n}\n","defaults":{}},"Agent":{"html":"\n\n<div style=\"font-family: Roboto, system-ui, sans-serif; color: #001E6A\">\n\n  <\!-- Panneau de conversation -->\n  <sc-if value=\"{{open}}\" hint-placeholder-val=\"{{ false }}\">\n    <section role=\"dialog\" aria-label=\"Assistant Charvet Électronique\" class=\"cx-pop\" style=\"{{panelStyle}}\">\n      <div style=\"background: #001E6A; color: #FFFFFF; padding: 18px 18px 18px 20px; display: flex; align-items: center; gap: 14px\">\n        <span aria-hidden=\"true\" style=\"position: relative; width: 44px; height: 44px; border-radius: 50%; background: #ECEEF8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">\n          <span ref=\"{{headAtomRef}}\" style=\"width: 38px; height: 38px; display: block\"></span>\n          <span style=\"position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; border-radius: 50%; background: #3BD16F; box-shadow: 0 0 0 2px #001E6A\"></span>\n        </span>\n        <div style=\"display: flex; flex-direction: column; gap: 2px; flex-grow: 1\">\n          <span style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 18px\">Assistant Charvet</span>\n          <span style=\"font-size: 13px; color: #C9D3F5\">Réponses guidées · orientation immédiate</span>\n        </div>\n        <button type=\"button\" aria-label=\"Recommencer la conversation\" onClick=\"{{restart}}\" style=\"width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.12); color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 3-6.7L3 8\"></path><path d=\"M3 3v5h5\"></path></svg></button>\n        <button type=\"button\" aria-label=\"Fermer l’assistant\" onClick=\"{{toggle}}\" style=\"width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.12); color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"></path></svg></button>\n      </div>\n\n      <div ref=\"{{bodyRef}}\" aria-live=\"polite\" style=\"flex: 1 1 auto; overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px; background-color: #F6F7FC; background-image: radial-gradient(circle, rgba(0,30,106,0.07) 1px, transparent 1.6px); background-size: 20px 20px\">\n        <sc-for list=\"{{messages}}\" as=\"m\" hint-placeholder-count=\"2\">\n          <sc-if value=\"{{m.isBot}}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"cx-fade\" style=\"align-self: flex-start; max-width: 88%; display: flex; flex-direction: column; gap: 8px\">\n              <div style=\"background: #FFFFFF; border: 1px solid #DDE2F1; border-radius: 4px 18px 18px 18px; padding: 12px 14px; font-size: 15px; line-height: 1.55; color: #001E6A; white-space: pre-lin
