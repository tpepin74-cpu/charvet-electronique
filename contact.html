<style>
body{margin:0;background:#FFFFFF}
*{box-sizing:border-box}
a{color:#001E6A;text-decoration:none}a:hover{color:#2A4BC4}
.cx-pair{display:inline-flex;align-items:center;gap:6px}
.cx-btn{display:inline-flex;align-items:center;gap:12px;min-height:50px;padding:0 24px 0 18px;border-radius:16px;background:#001E6A;color:#FFFFFF;font-family:'Hanken Grotesk',sans-serif;font-size:17px;transition:background .35s ease}
.cx-arrow{width:50px;height:50px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#001E6A;color:#FFFFFF;transition:transform .45s cubic-bezier(.2,.8,.2,1),background .35s}
.cx-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;transition:transform .4s ease,background .4s ease}
.cx-in{width:100%;min-height:52px;padding:0 16px;border:1px solid #C9D0EA;border-radius:14px;background:#FFFFFF;color:#001E6A;transition:border-color .3s,box-shadow .3s}
.cx-in:focus{outline:none;border-color:#001E6A;box-shadow:0 0 0 4px rgba(0,30,106,.10)}
.cx-acc{transition:background-color .2s ease}
.cx-sph{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,#FFFFFF 0%,#F4F5FB 28%,#D9DDF1 68%,#BFC6E6 100%);box-shadow:inset -12px -16px 34px rgba(110,122,190,.28),0 24px 50px rgba(40,52,130,.10);animation:cx-float 9s ease-in-out infinite}
.cx-p{position:absolute;border-radius:50%;background:#C9D5FF;animation:cx-tw 4s ease-in-out infinite}
.cx-field{position:absolute;inset:-5%;animation:cx-drift 26s ease-in-out infinite alternate}
.cx-fade{animation:cx-in .8s cubic-bezier(.2,.8,.2,1) both}
.cx-rise{animation:cx-up 1s cubic-bezier(.2,.8,.2,1) both}
.cx-d2{animation-delay:.24s}
.cx-ping{animation:cx-ping 2s cubic-bezier(0,0,.2,1) infinite}
.cx-check{stroke-dasharray:40;stroke-dashoffset:40;animation:cx-draw .8s .3s ease forwards}
@keyframes cx-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes cx-tw{0%,100%{opacity:.15}50%{opacity:.95}}
@keyframes cx-drift{from{transform:translate(0,0)}to{transform:translate(-3%,2%)}}
@keyframes cx-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes cx-up{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes cx-ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(3.2);opacity:0}}
@keyframes cx-draw{to{stroke-dashoffset:0}}
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1)}
html{scrollbar-color:#B9C2E2 transparent;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
::selection{background:#001E6A;color:#FFFFFF}
:focus-visible{outline:2px solid #2A4BC4;outline-offset:3px}
a{text-underline-offset:3px}
.cx-btn,.cx-tab{white-space:nowrap}
.cx-btn{transition:background-color .2s ease,color .2s ease,transform .16s var(--ease-out)}
.cx-arrow{transition:background-color .2s ease,color .2s ease,transform .32s var(--ease-out)}
.cx-dot{transition:transform .25s var(--ease-out),background-color .2s ease}
.cx-pair:active .cx-btn{transform:scale(.97)}
.cx-pair:active .cx-arrow{transform:scale(.94)}
.cx-tab{transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .16s var(--ease-out)}
.cx-tab:active,.cx-opt:active,.cx-launch:active,.cx-acc:active{transform:scale(.99)}
.cx-opt,.cx-launch{transition:background-color .15s ease,border-color .15s ease,transform .16s var(--ease-out)}
.cx-pop{animation:cx-pop .22s var(--ease-out) both}
@keyframes cx-pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.cx-in{font-size:16px}
@media (hover:hover) and (pointer:fine){
.cx-pair:hover .cx-btn,.cx-pair:hover .cx-arrow{background:#0B33A8;color:#FFFFFF}
.cx-pair:hover .cx-dot{transform:scale(1.3);background:currentColor}
.cx-pair:hover .cx-arrow{transform:rotate(45deg)}
.cx-pair:hover:active .cx-arrow{transform:rotate(45deg) scale(.94)}
.cx-tab[aria-pressed="false"]:hover{background:#F2F4FB !important;border-color:#001E6A !important}
.cx-opt:hover{background:#ECEEF8 !important;border-color:#001E6A !important}
.cx-acc:hover{background:#F6F7FC}
.cx-in:hover{border-color:#8E9BCB}
}
@media (max-width:760px){
.cx-container{padding-left:20px !important;padding-right:20px !important}
.cx-hero-inner{padding-top:36px !important;padding-bottom:56px !important}
.cx-card-body{padding:28px 20px !important}
.cx-sec{padding-top:40px !important;padding-bottom:56px !important}
.cx-acc{font-size:18px !important;padding:16px 4px !important}
.cx-tab{white-space:normal;text-align:left}
}
@media (prefers-reduced-motion: reduce){
.cx-sph,.cx-p,.cx-ping{animation:none !important}
.cx-rise,.cx-fade,.cx-pop{animation:cx-op .25s ease both !important}
}
@keyframes cx-op{from{opacity:0}to{opacity:1}}
@keyframes cx-par{from{translate:0 -7%}to{translate:0 7%}}
@supports (animation-timeline: view()){
@media (prefers-reduced-motion: no-preference){
.cx-zoom img{scale:1.16;animation:cx-par linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
}
}
input,select,textarea,button{font:inherit}
</style>

<div id="root"></div>
<script>DC.mount({"Contact":{"html":"\n\n<div style=\"font-family: Roboto, system-ui, sans-serif; color: #001E6A; background: #FFFFFF; width: 100%; overflow-x: clip; position: relative\">\n\n  <\!-- Hero -->\n  <section style=\"position: relative; background: #ECEEF8; border-radius: 0 0 48px 48px; overflow: hidden\">\n    <div aria-hidden=\"true\" style=\"position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(0,30,106,0.10) 1px, transparent 1.6px); background-size: 26px 26px; opacity: 0.7\"></div>\n    <span aria-hidden=\"true\" class=\"cx-sph\" style=\"right: 14%; top: 130px; width: 120px; height: 120px\"></span>\n    <span aria-hidden=\"true\" class=\"cx-sph\" style=\"right: 8%; top: 240px; width: 70px; height: 70px; animation-delay: -3s\"></span>\n    <span aria-hidden=\"true\" class=\"cx-sph\" style=\"right: 24%; top: 250px; width: 54px; height: 54px; animation-delay: -6s\"></span>\n    <div style=\"position: relative\"><dc-import name=\"Header\" active=\"contact\" hint-size=\"100%,84px\"></dc-import></div>\n    <div class=\"cx-container cx-hero-inner\" style=\"position: relative; max-width: 1240px; margin: 0 auto; padding: 72px 32px 96px; display: flex; flex-direction: column; gap: 24px\">\n      <nav aria-label=\"Fil d’Ariane\" style=\"font-size: 14px; color: #4B5A8C\"><a href=\"index.html\" style=\"color: #4B5A8C\">Accueil</a> <span aria-hidden=\"true\">/</span> Contact</nav>\n      <h1 class=\"cx-rise\" style=\"margin: 0; font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: clamp(44px, 5.4vw, 76px); line-height: 1.04; letter-spacing: -0.025em; max-width: 760px\">Parlons de votre besoin</h1>\n      <p class=\"cx-rise cx-d2\" style=\"margin: 0; max-width: 600px; font-size: 17px; line-height: 1.7; color: #1D2F72\">Devis, renseignement produit, station JBC ou équipement ZEVATRON : choisissez le type de demande, notre équipe vous répond.</p>\n    </div>\n  </section>\n\n  <\!-- Formulaire + coordonnées -->\n  <section class=\"cx-container cx-sec\" style=\"max-width: 1240px; margin: 0 auto; padding: 72px 32px 96px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n\n    <div class=\"cx-card-body\" style=\"flex: 1.6 1 520px; min-width: 0; border: 1px solid #C9D0EA; border-radius: 30px; padding: 44px 40px; background-image: radial-gradient(circle, rgba(0,30,106,0.08) 1px, transparent 1.6px); background-size: 22px 22px\">\n      <sc-if value=\"{{sent}}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"cx-fade\" role=\"status\" style=\"min-height: 520px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center\">\n          <span aria-hidden=\"true\" ref=\"{{checkRef}}\" style=\"width: 140px; height: 140px; display: block\"></span>\n          <h2 style=\"margin: 0; font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: 40px\">Merci {{firstName}} !</h2>\n          <p style=\"margin: 0; max-width: 440px; line-height: 1.7; color: #1D2F72\">Votre demande « {{typeLabel}} »{{sentNote}} a bien été transmise. Nous revenons vers vous à l’adresse {{f.email}}.</p>\n          <button type=\"button\" onClick=\"{{reset}}\" class=\"cx-pair\" style=\"border: 0; background: transparent; padding: 0; cursor: pointer\"><span class=\"cx-btn\"><span class=\"cx-dot\"></span>Nouvelle demande</span></button>\n        </div>\n      </sc-if>\n      <sc-if value=\"{{notSent}}\" hint-placeholder-val=\"{{ true }}\">\n        <form onSubmit=\"{{submit}}\" novalidate style=\"display: flex; flex-direction: column; gap: 28px\">\n          <fieldset style=\"border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px\">\n            <legend style=\"padding: 0; margin-bottom: 14px; font-family: 'Hanken Grotesk', sans-serif; font-size: 24px\">1. Type de demande</legend>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n              <sc-for list=\"{{types}}\" as=\"t\" hint-placeholder-count=\"5\">\n                <button type=\"button\" class=\"cx-tab\" aria-pressed=\"{{t.pressed}}\" onClick=\"{{t.pick}}\" style=\"{{t.style}}\">{{t.label}}</button>\n              </sc-for>\n            </div>\n            <p class=\"cx-fade\" key=\"{{typeKey}}\" style=\"margin: 0; padding: 14px 16px; border-radius: 14px; background: #ECEEF8; font-size: 15px; line-height: 1.6; color: #1D2F72\">{{typeHint}}</p>\n          </fieldset>\n\n          <fieldset style=\"border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px\">\n            <legend style=\"padding: 0; margin-bottom: 14px; font-family: 'Hanken Grotesk', sans-serif; font-size: 24px\">2. Vos coordonnées</legend>\n            <label style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500\">Nom et prénom *\n              <input class=\"cx-in\" type=\"text\" name=\"nom\" autocomplete=\"name\" value=\"{{f.nom}}\" onChange=\"{{onNom}}\" aria-invalid=\"{{errNomFlag}}\">\n              <sc-if value=\"{{errNom}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-weight: 400; color: #B3261E\">Indiquez votre nom.</span></sc-if>\n            </label>\n            <label style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500\">Société\n              <input class=\"cx-in\" type=\"text\" name=\"societe\" autocomplete=\"organization\" value=\"{{f.societe}}\" onChange=\"{{onSociete}}\">\n            </label>\n            <label style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500\">E-mail *\n              <input class=\"cx-in\" type=\"email\" name=\"email\" autocomplete=\"email\" value=\"{{f.email}}\" onChange=\"{{onEmail}}\" aria-invalid=\"{{errEmailFlag}}\">\n              <sc-if value=\"{{errEmail}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-weight: 400; color: #B3261E\">Indiquez une adresse e-mail valide.</span></sc-if>\n            </label>\n            <label style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500\">Téléphone\n              <input class=\"cx-in\" type=\"tel\" name=\"tel\" autocomplete=\"tel\" value=\"{{f.tel}}\" onChange=\"{{onTel}}\">\n            </label>\n          </fieldset>\n\n          <fieldset style=\"border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px\">\n            <legend style=\"padding: 0; margin-bottom: 14px; font-family: 'Hanken Grotesk', sans-serif; font-size: 24px\">3. Votre demande</legend>\n            <sc-if value=\"{{hasBasket}}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"cx-fade\" style=\"padding: 18px; border-radius: 18px; background: #ECEEF8; display: flex; flex-direction: column; gap: 10px\">\n                <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\">\n                  <span style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 18px\">Votre sélection du catalogue ({{basketCount}})</span>\n                  <a href=\"produits.html\" style=\"font-size: 14px; text-decoration: underline\">Modifier</a>\n                </div>\n                <ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px\">\n                  <sc-for list=\"{{basketItems}}\" as=\"b\" hint-placeholder-count=\"2\">\n                    <li style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 4px 4px 4px 14px; border-radius: 12px; background: #FFFFFF\">\n                      <span style=\"font-size: 15px; line-height: 1.4\">{{b.label}}</span>\n                      <button type=\"button\" onClick=\"{{b.remove}}\" aria-label=\"{{b.aria}}\" style=\"width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; border: 0; background: transparent; color: #001E6A; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"></path></svg></button>\n                    </li>\n                  </sc-for>\n                </ul>\n              </div>\n            </sc-if>\n            <sc-if value=\"{{showStation}}\" hint-placeholder-val=\"{{ false }}\">\n              <label class=\"cx-fade\" style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500\">Sujet\n                <select class=\"cx-in\" name=\"station\" value=\"{{f.station}}\" onChange=\"{{onStation}}\">\n                  <option>Choisir une station JBC</option>\n                  <option>Pannes &amp; accessoires JBC</option>\n                  <option>Équipement ZEVATRON</option>\n                </select>\n              </label>\n            </sc-if>\n            <sc-if value=\"{{showRefs}}\" hint-placeholder-val=\"{{ true }}\">\n              <label class=\"cx-fade\" style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500\">Références et quantités\n                <input class=\"cx-in\" type=\"text\" name=\"refs\" placeholder=\"Ex. : référence, marque, quantité\" value=\"{{f.refs}}\" onChange=\"{{onRefs}}\">\n              </label>\n            </sc-if>\n            <label style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500\">Message\n              <textarea class=\"cx-in\" name=\"message\" rows=\"5\" value=\"{{f.message}}\" onChange=\"{{onMessage}}\" style=\"padding: 14px 16px; resize: vertical; min-height: 140px\"></textarea>\n            </label>\n            <label style=\"display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.55; color: #1D2F72\">\n              <input type=\"checkbox\" name=\"rgpd\" checked=\"{{f.rgpd}}\" onChange=\"{{onRgpd}}\" style=\"width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #001E6A\">\n              J’accepte que mes données soient utilisées pour traiter ma demande, conformément à la politique de confidentialité. *\n            </label>\n            <sc-if value=\"{{errRgpd}}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size: 14px; color: #B3261E\">Merci d’accepter le traitement de vos données pour envoyer la demande.</span></sc-if>\n          </fieldset>\n\n          <div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center\">\n            <button type=\"submit\" class=\"cx-pair\" style=\"border: 0; background: transparent; padding: 0; cursor: pointer\"><span class=\"cx-btn\"><span class=\"cx-dot\"></span>Envoyer ma demande</span><span class=\"cx-arrow\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17L17 7M9 7h8v8\"></path></svg></span></button>\n            <span style=\"font-size: 13px; color: #4B5A8C\">* Champs obligatoires</span>\n          </div>\n        </form>\n      </sc-if>\n    </div>\n\n    <aside style=\"flex: 1 1 340px; display: flex; flex-direction: column; gap: 16px\">\n      <div class=\"cx-zoom\" style=\"position: relative; border-radius: 30px; overflow: hidden; min-height: 280px; background: #00113F\">\n        <img src=\"assets/gre-bulles.jpg\" alt=\"Les bulles du téléphérique de la Bastille au-dessus de Grenoble\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\">\n        <div aria-hidden=\"true\" style=\"position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,30,106,0.55) 0%, rgba(0,30,106,0) 55%)\"></div>\n        <span aria-hidden=\"true\" style=\"position: absolute; right: 24px; top: 24px; width: 18px; height: 18px\">\n          <span class=\"cx-ping\" style=\"position: absolute; inset: 0; border-radius: 50%; background: #FFFFFF\"></span>\n          <span style=\"position: absolute; inset: 0; border-radius: 50%; background: #001E6A; box-shadow: 0 0 0 4px #FFFFFF\"></span>\n        </span>\n        <span style=\"position: absolute; left: 20px; bottom: 18px; color: #FFFFFF; font-family: 'Hanken Grotesk', sans-serif; font-size: 22px; font-weight: 300\">Grenoble · Espace Général Mangin</span>\n      </div>\n      <div style=\"border: 1px solid #C9D0EA; border-radius: 30px; padding: 32px; display: flex; flex-direction: column; gap: 18px\">\n        <span style=\"font-family: 'Hanken Grotesk', sans-serif; font-size: 24px\">Charvet Électronique</span>\n        <div style=\"display: flex; gap: 14px; align-items: flex-start\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#001E6A\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M12 22s7-6.1 7-12a7 7 0 0 0-14 0c0 5.9 7 12 7 12z\"></path><circle cx=\"12\" cy=\"10\" r=\"2.5\"></circle></svg><span style=\"line-height: 1.6\">73D, rue du Général Mangin<br>Espace Général Mangin<br>38100 Grenoble, France</span></div>\n        <div style=\"display: flex; gap: 14px; align-items: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#001E6A\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0\"><path d=\"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z\"></path></svg><span>[TÉLÉPHONE]</span></div>\n        <div style=\"display: flex; gap: 14px; align-items: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#001E6A\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"></rect><path d=\"M22 6l-10 7L2 6\"></path></svg><span>[E-MAIL]</span></div>\n        <div style=\"display: flex; gap: 14px; align-items: center\"><svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#001E6A\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M12 7v5l3 2\"></path></svg><span>[HORAIRES D’OUVERTURE]</span></div>\n        <a href=\"https://www.linkedin.com/company/charvet-electronique/\" style=\"text-decoration: underline\">Suivre Charvet Électronique sur LinkedIn</a>\n      </div>\n    </aside>\n  </section>\n\n  <\!-- FAQ -->\n  <section class=\"cx-container\" style=\"max-width: 960px; margin: 0 auto; padding: 40px 32px 140px\">\n    <h2 style=\"margin: 0 0 32px; text-align: center; font-family: 'Hanken Grotesk', sans-serif; font-weight: 300; font-size: clamp(34px, 4vw, 54px); letter-spacing: -0.02em\">Questions fréquentes</h2>\n    <div style=\"border-top: 1px solid #DDE2F1\">\n      <sc-for list=\"{{faq}}\" as=\"q\" hint-placeholder-count=\"4\">\n        <div style=\"border-bottom: 1px solid #DDE2F1\">\n          <button type=\"button\" class=\"cx-acc\" aria-expanded=\"{{q.expanded}}\" onClick=\"{{q.toggle}}\" style=\"width: 100%; min-height: 72px; padding: 18px 12px; border: 0; background: transparent; color: #001E6A; display: flex; justify-content: space-between; align-items: center; gap: 16px; cursor: pointer; text-align: left; font-family: 'Hanken Grotesk', sans-serif; font-size: 21px\">\n            {{q.q}}\n            <span aria-hidden=\"true\" style=\"{{q.iconStyle}}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"></path></svg></span>\n          </button>\n          <sc-if value=\"{{q.open}}\" hint-placeholder-val=\"{{ fals ;\n  }\n  renderVals() {\n    var self = this;\n    var st = this.state;\n    var f = st.f;\n    var typeDefs = [\n      { id: 'devis', label: 'Demande de devis', hint: 'Indiquez les références, marques et quantités souhaitées : nous vous adressons un devis avec les délais.' },\n      { id: 'produit', label: 'Renseignement produit', hint: 'Décrivez votre application ou le produit recherché : un conseiller vous oriente vers la solution adaptée.' },\n      { id: 'stations', label: 'Stations JBC / ZEVATRON', hint: 'Choix d’une station, pannes et accessoires JBC ou équipement ZEVATRON : précisez le sujet ci-dessous.' },\n      { id: 'delai', label: 'Disponibilité & délai', hint: 'Les produits en stock sont livrés sous 48 h. Donnez-nous la référence pour vérifier la disponibilité.' },\n      { id: 'autre', label: 'Autre demande', hint: 'Une autre question ? Écrivez-nous, nous transmettons votre message à la bonne personne.' }\n    ];\n    var cur = typeDefs.filter(function (t) { return t.id === st.type; })[0];\n    var errNom = st.tried && !String(f.nom).trim();\n    var errEmail = st.tried && !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(String(f.email).trim());\n    var errRgpd = st.tried && !f.rgpd;\n    var faqData = [\n      { q: 'Quels sont vos délais de livraison ?', a: 'Les produits en stock sont livrés sous 48 heures. Pour un article hors stock, le délai vous est communiqué avec le devis.' },\n      { q: 'Servez-vous les petites quantités ?', a: 'Oui : nous accompagnons aussi bien les prototypes et petites séries que les grands volumes de production.' },\n      { q: 'Êtes-vous distributeur officiel JBC et ZEVATRON ?', a: 'Oui. Nous vous conseillons sur le choix des équipements et assurons le réassort des consommables et accessoires.' },\n      { q: 'Où êtes-vous situés ?', a: 'À Grenoble, Espace Général Mangin, au 73D rue du Général Mangin (38100).' }\n    ];\n    return {\n      f: f,\n      checkRef: this.checkRef,\n      sent: st.sent,\n      notSent: !st.sent,\n      types: typeDefs.map(function (t) {\n        var on = t.id === st.type;\n        return {\n          label: t.label,\n          pressed: on ? 'true' : 'false',\n          pick: function () { self.setState({ type: t.id }); },\n          style: 'min-height:46px;padding:0 18px;border-radius:14px;cursor:pointer;font-family:Hanken Grotesk,sans-serif;font-size:16px;border:1px solid ' + (on ? '#001E6A' : '#C9D0EA') + ';color:' + (on ? '#FFFFFF' : '#001E6A') + ';background:' + (on ? '#001E6A' : '#FFFFFF')\n        };\n      }),\n      typeHint: cur.hint,\n      typeKey: 'h-' + st.type,\n      typeLabel: cur.label,\n      showStation: st.type === 'stations',\n      showRefs: st.type === 'devis' || st.type === 'delai',\n      onNom: this.setField('nom'),\n      onSociete: this.setField('societe'),\n      onEmail: this.setField('email'),\n      onTel: this.setField('tel'),\n      onRefs: this.setField('refs'),\n      onStation: this.setField('station'),\n      onMessage: this.setField('message'),\n      onRgpd: this.setField('rgpd'),\n      errNom: errNom, errNomFlag: errNom ? 'true' : 'false',\n      errEmail: errEmail, errEmailFlag: errEmail ? 'true' : 'false',\n      errRgpd: errRgpd,\n      firstName: String(f.nom).trim().split(' ')[0],\n      submit: function (e) {\n        if (e && e.preventDefault) e.preventDefault();\n        var ok = String(f.nom).trim() && /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(String(f.email).trim()) && f.rgpd;\n        if (ok) { var n = (self.state.basket || []).length; self.saveBasket([]); self.setState({ sent: true, tried: false, sentCount: n }); }\n        else self.setState({ tried: true });\n      },\n      hasBasket: (st.basket || []).length > 0,\n      basketCount: (st.basket || []).length,\n      basketItems: (st.basket || []).map(function (label, i) {\n        return { label: label, aria: 'Retirer ' + label, remove: function () { var b = self.state.basket.slice(); b.splice(i, 1); self.saveBasket(b); } };\n      }),\n      sentNote: st.sen 2,1);';\n    var sm = !!st.small;\n    return {\n      logoImg: 'object-fit:contain;mix-blend-mode:multiply;flex-shrink:0;' + (sm ? 'width:46px;height:44px' : 'width:60px;height:57px'),\n      logoName: 'font-weight:500;letter-spacing:0.1em;font-size:' + (sm ? '21px' : '27px'),\n      logoSub: 'color:#4B5A8C;white-space:nowrap;font-size:' + (sm ? '13px' : '16px'),\n      wide: !st.compact,\n      compact: st.compact,\n      showMenu: st.compact && st.open,\n      openStr: st.open ? 'true' : 'false',\n      menuLabel: st.open ? 'Fermer le menu' : 'Ouvrir le menu',\n      toggle: function () { self.setState({ open: !self.state.open }); },\n      bar1: bar + 'top:19px;' + (st.open ? 'transform:translateY(4px) rotate(45deg)' : ''),\n      bar2: bar + 'top:27px;' + (st.open ? 'transform:translateY(-4px) rotate(-45deg)' : ''),\n      links: items.map(function (it) {\n        var on = it.id === active;\n        return {\n          label: it.label,\n          href: it.href,\n          current: on ? 'page' : 'false',\n          style: 'display:inline-flex;align-items:center;min-height:44px;color:#001E6A;text-decoration:none;white-space:nowrap;border-bottom:1.5px solid ' + (on ? '#001E6A' : 'transparent'),\n          mStyle: 'display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 16px;border-radius:14px;font-size:22px;font-weight:300;color:#001E6A;text-decoration:none;background:' + (on ? '#ECEEF8' : 'transparent')\n        };\n      })\n    };\n  }\n}\n","defaults":{"active":"accueil"}}}, "Contact");</script>
